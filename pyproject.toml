["project"]
"name" = "wood-pi-config"
"version" = "0.0.1"
"description" = "Repository tooling for the Wood Pi configuration"
"requires-python" = ">=3.14"
"dependencies" = []

["tool"]

["tool"."uv"]
"package" = false

["tool"."wood"]

["tool"."wood"."openproject"]
"project_id" = 3
"initiative_id" = 531
"release_id" = 24
"epic_id" = 532

["tool"."wood"."architecture"]
"domain" = "engineering"
"capability" = "agent-configuration"
"kind" = "configuration"

["tool"."wood"."branching"]
"strategy" = "integration"
"release_id" = 24
"integration_branch" = "development"
"scope_reference" = "https://projects.woodhost.cloud/work_packages/558 activity 1481; canonical fleet migration authorized 2026-10-15; protected-main merges remain separately approved."

["tool"."semantic_release"]
"commit_parser" = "conventional"
"allow_zero_version" = true
"tag_format" = "v{version}"
"version_toml" = ["pyproject.toml:project.version"]
"version_variables" = []
"build_command" = ""

["tool"."semantic_release"."remote"]
"type" = "github"

["tool"."semantic_release"."publish"]
"upload_to_vcs_release" = false

["dependency-groups"]
"dev" = ["pre-commit==4.3.0", "python-semantic-release==10.4.1"]

[tool.wood.verify]
version = 1
retry_safe = true

[[tool.wood.verify.checks]]
name = "google-drive-read-access"
argv = ["node", "--import", "tsx", "scripts/drive-read-verify.ts"]
required = true
timeout_seconds = 60
