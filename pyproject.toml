[project]
name = "wood-pi-config"
version = "0.0.1"
description = "Repository tooling for the Wood Pi configuration"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = ["pre-commit==4.3.0", "python-semantic-release==10.4.1"]

[tool.wood.openproject]
project_id = 3
initiative_id = 531
release_id = 24
epic_id = 532

[tool.semantic_release]
commit_parser = "conventional"
allow_zero_version = true
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = []
build_command = ""

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.publish]
upload_to_vcs_release = false
